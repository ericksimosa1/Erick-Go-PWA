# netlify.toml

# Redirigir todas las peticiones a /api/* a las funciones de Netlify
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# --- CONFIGURACIÓN PARA TAREAS PROGRAMADAS (CRON JOBS) ---
# Esta sección le dice a Netlify que ejecute nuestra función de recordatorios
# cada 5 minutos. La función interna decidirá, basándose en la configuración del administrador,
# si es el momento correcto de enviar notificaciones.

[[scheduled_functions]]
  # Nombre de la función que queremos ejecutar
  path = "/send-attendance-reminder"  
  # Programación en formato Cron.
  # "*/5 * * * *" significa: "en el minuto 0, 5, 10, 15... de cada hora, de cada día".
  schedule = "*/5 * * * *"

[build]
  # Comando para construir tu aplicación
  command = "npm run build"
  # Carpeta donde se encuentran los archivos estáticos generados
  publish = "dist"