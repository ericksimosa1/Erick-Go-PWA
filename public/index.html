<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Erick Go - Transporte de Personal</title>
    
    <!-- PWA Meta Tags Generales -->
    <meta name="theme-color" content="#1A237E" />
    <meta name="description" content="Aplicación para la organización de viajes de empresa." />
    
    <!-- --- CRÍTICO PARA IOS (IPHONE) --- -->
    <!-- Le dice a iOS que la app es instalable -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- --- ICONOS --- -->
    <link rel="apple-touch-icon" href="/erick-go-logo.png" />
    <link rel="icon" type="image/png" href="/erick-go-logo.png" />
    
    <!-- --- MANIFEST --- -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    
    <!-- --- SCRIPT DEL SERVICE WORKER CON CACHE BUSTER V18 --- -->
    <!-- Al poner ?v=12, obligamos al navegador a descargar el archivo SW nuevo -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          console.log('[HTML] Registrando Service Worker v18 desde public/index.html');
          navigator.serviceWorker.register('/sw.js?v=18');
        });
      }
    </script>
  </body>
</html>
